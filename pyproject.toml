[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "littercoast"
version = "0.1.0"
description = "Coastal waste detection utilities with training, inference, and QR generation."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Pillow",
    "qrcode",
    "ultralytics",
]

[project.optional-dependencies]
dev = [
    "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
