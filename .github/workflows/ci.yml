name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "feature/**"
      - "fix/**"
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install project
        run: pip install -e .

      - name: Validate package build metadata
        run: pip install build && python -m build --sdist --wheel --outdir dist

      - name: Run syntax checks
        run: python -m compileall src yolo_bbox_training.py bbox_image_inference.py qr.py

      - name: Validate CLI entrypoint
        run: python -m littercoast --help
